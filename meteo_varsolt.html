<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: #ffffff;
}

.widget {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    background: #000000;
    border: none;
    border-radius: 0;
    padding: 18px 22px;
    position: relative;
}


/* ================================
   STÂNGA - ORĂ + DATĂ
================================ */

.clock-section {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    width: 38%;
}

.time {
    font-size: 54px;
    line-height: 54px;
    font-weight: 600;
    letter-spacing: -2px;
    color: #ffffff;
}

.seconds {
    font-size: 20px;
    font-weight: normal;
    letter-spacing: 0;
    color: #7f8a94;
    margin-left: 5px;
}

.date {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 1.4px;
    color: #8d98a3;
}


/* ================================
   DREAPTA - VREME
================================ */

.weather-section {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    width: 55%;
    text-align: right;
}

.weather-header {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #8d98a3;
    margin-bottom: 8px;
}

.location {
    color: #ffffff;
    font-weight: bold;
}

.weather-main {
    white-space: nowrap;
}

.temperature {
    display: inline-block;
    font-size: 52px;
    line-height: 52px;
    font-weight: 600;
    letter-spacing: -2px;
    color: #ffffff;
    vertical-align: middle;
}

.degree {
    font-size: 20px;
    vertical-align: top;
    position: relative;
    top: 4px;
    margin-left: 2px;
    color: #a7b0b8;
    letter-spacing: 0;
}

.condition {
    display: inline-block;
    margin-left: 18px;
    font-size: 16px;
    color: #d0d5da;
    vertical-align: middle;
}

.details {
    margin-top: 11px;
    font-size: 11px;
    letter-spacing: 0.4px;
    color: #7f8a94;
}

.detail-value {
    color: #e5e8eb;
    font-size: 13px;
    margin-left: 4px;
    margin-right: 15px;
}

.detail-value:last-child {
    margin-right: 0;
}

.weather-update {
    margin-top: 8px;
    font-size: 9px;
    color: #4f5962;
}


/* ================================
   LINIE SEPARATOARE
================================ */

.separator {
    position: absolute;
    left: 41%;
    top: 22%;
    height: 56%;
    width: 1px;
    background: #20272d;
}


/* ================================
   ERROR
================================ */

.error {
    font-size: 12px;
    color: #8d98a3;
}
</style>
</head>

<body>

<div class="widget">

    <!-- ORĂ -->
    <div class="clock-section">
        <div class="time">
            <span id="clock">--:--</span>
            <span class="seconds" id="seconds">--</span>
        </div>

        <div class="date" id="date">
            -- · -- -- ----
        </div>
    </div>


    <div class="separator"></div>


    <!-- VREME -->
    <div class="weather-section">

        <div class="weather-header">
            <span class="location">VÂRȘOLȚ</span> · METEO
        </div>

        <div id="weather">
            <div class="error">
                Se actualizează vremea...
            </div>
        </div>

    </div>

</div>


<script>

/* =========================================================
   CEAS
========================================================= */

var days = [
    "DUMINICĂ",
    "LUNI",
    "MARȚI",
    "MIERCURI",
    "JOI",
    "VINERI",
    "SÂMBĂTĂ"
];

var months = [
    "IAN",
    "FEB",
    "MAR",
    "APR",
    "MAI",
    "IUN",
    "IUL",
    "AUG",
    "SEP",
    "OCT",
    "NOV",
    "DEC"
];


function pad(value) {

    if (value < 10)
        return "0" + value;

    return value;
}


function updateClock() {

    var now = new Date();

    var hours =
        pad(now.getHours());

    var minutes =
        pad(now.getMinutes());

    var seconds =
        pad(now.getSeconds());


    document.getElementById("clock").innerHTML =
        hours + ":" + minutes;


    document.getElementById("seconds").innerHTML =
        seconds;


    document.getElementById("date").innerHTML =

        days[now.getDay()] +

        " · " +

        pad(now.getDate()) +

        " " +

        months[now.getMonth()] +

        " " +

        now.getFullYear();
}


/* update instant */
updateClock();


/* update în fiecare secundă */
setInterval(
    updateClock,
    1000
);



/* =========================================================
   METEO
========================================================= */

function description(code) {

    if (code === 0)
        return "Cer senin";

    if (code === 1)
        return "Predominant senin";

    if (code === 2)
        return "Parțial noros";

    if (code === 3)
        return "Noros";


    if (code === 45 || code === 48)
        return "Ceață";


    if (code >= 51 && code <= 55)
        return "Burniță";


    if (code >= 61 && code <= 65)
        return "Ploaie";


    if (code >= 71 && code <= 77)
        return "Ninsoare";


    if (code >= 80 && code <= 82)
        return "Averse";


    if (code >= 95)
        return "Furtună";


    return "Vreme variabilă";
}


function roundValue(value) {

    return Math.round(value);
}


function weatherUpdateTime() {

    var date =
        new Date();

    return (
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes())
    );
}


function renderWeather(data) {

    var current =
        data.current;

    var daily =
        data.daily;


    var temperature =
        roundValue(
            current.temperature_2m
        );


    var minTemperature =
        roundValue(
            daily.temperature_2m_min[0]
        );


    var maxTemperature =
        roundValue(
            daily.temperature_2m_max[0]
        );


    var wind =
        roundValue(
            current.wind_speed_10m
        );


    document.getElementById("weather").innerHTML =

        '<div class="weather-main">' +

            '<span class="temperature">' +

                temperature +

                '<span class="degree">' +
                    '°C' +
                '</span>' +

            '</span>' +


            '<span class="condition">' +

                description(
                    current.weather_code
                ) +

            '</span>' +

        '</div>' +


        '<div class="details">' +

            'MIN' +

            '<span class="detail-value">' +
                minTemperature +
                '°' +
            '</span>' +


            'MAX' +

            '<span class="detail-value">' +
                maxTemperature +
                '°' +
            '</span>' +


            'VÂNT' +

            '<span class="detail-value">' +
                wind +
                ' km/h' +
            '</span>' +

        '</div>' +


        '<div class="weather-update">' +

            'METEO ACTUALIZAT ' +
            weatherUpdateTime() +

        '</div>';
}



function loadWeather() {

    var url =

        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=47.20" +

        "&longitude=22.9333" +

        "&current=" +
        "temperature_2m," +
        "weather_code," +
        "wind_speed_10m" +

        "&daily=" +
        "temperature_2m_max," +
        "temperature_2m_min" +

        "&timezone=Europe%2FBucharest" +

        "&forecast_days=1";


    var xhr =
        new XMLHttpRequest();


    xhr.onreadystatechange =
        function() {

            if (xhr.readyState === 4) {

                if (
                    xhr.status >= 200 &&
                    xhr.status < 300
                ) {

                    try {

                        var data =
                            JSON.parse(
                                xhr.responseText
                            );


                        renderWeather(data);

                    }
                    catch (e) {

                        showWeatherError();

                    }

                }
                else {

                    showWeatherError();

                }

            }

        };


    xhr.open(
        "GET",
        url,
        true
    );


    xhr.send();
}



function showWeatherError() {

    document.getElementById("weather").innerHTML =

        '<div class="error">' +
            'Vreme indisponibilă momentan' +
        '</div>';
}



/* prima încărcare */
loadWeather();


/* refresh meteo la fiecare 10 minute */
setInterval(
    loadWeather,
    600000
);

</script>

</body>
</html>
